id = "qqbot.bridge"
name = "QQ Bot Bridge"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Drive your herdr agents from QQ official bot: push on done/blocked, quote-reply to send text or files straight back in."
platforms = ["macos", "linux", "windows"]

# Windows resolves the bare `python` off PATH; POSIX entries use env(1) to put
# python3 first, because herdr's server PATH may miss Homebrew/local prefixes.
# POSIX users without a `python` alias: the split entries below already call
# python3, only the [[actions]] need editing on a POSIX machine.

# One-shot per herdr server start; it spawns the detached gateway daemon and exits.
[[startup]]
command = ["/usr/bin/env", "python3", "bot.py", "--ensure"]
platforms = ["linux", "macos"]

[[startup]]
command = ["python", "bot.py", "--ensure"]
platforms = ["windows"]

[[events]]
on = "pane.agent_status_changed"
command = ["/usr/bin/env", "python3", "notify.py"]
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["python", "notify.py"]
platforms = ["windows"]

[[actions]]
id = "test"
title = "Send QQ test message"
contexts = ["pane", "workspace"]
command = ["python", "notify.py", "--test"]

[[actions]]
id = "bot-status"
title = "QQ replies: daemon status"
contexts = ["pane", "workspace"]
command = ["python", "bot.py", "--status"]

[[actions]]
id = "bot-restart"
title = "QQ replies: restart daemon"
contexts = ["pane", "workspace"]
command = ["python", "bot.py", "--restart"]
