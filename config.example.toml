# 复制为 config.toml 放到插件配置目录（herdr plugin config-dir qqbot.bridge 打印路径）。

# QQ 开放平台 https://q.qq.com 机器人管理页里的 AppID / AppSecret
app_id = "REPLACE_ME"
app_secret = "REPLACE_ME"

# 使用场景: "c2c" 单聊（推荐，限制最松） / "group" 群聊
scene = "c2c"

# --- 指令分层 -----------------------------------------------------------------
# # 前缀 = 插件指令（#agents #use #start #close #status #read #esc #key #help）
# / 前缀与纯文本 = 原样透传给当前 agent，插件不接管（/model /clear 等直达 agent）

# #agents 按钮键盘的发送方式。QQ 内嵌键盘可能需要平台审核权限：
#   "markdown" = 随 Markdown 消息发（多数 bot 能渲染）
#   "text"     = 随纯文本消息发
#   "off"      = 不发键盘，只发文字列表（用 #use 序号 选择）
keyboard_mode = "markdown"

# --- agent 启动配置（可选，#start 用，仿 cc-connect 的命名 agent） -------------
# 配置后 #start <name> 按这里启动；未配置时 #start <kind> 直接按类型启动。
# cwd 由 pane 决定（新拆分 pane 继承焦点 pane 的工作目录）。
# [[agent]]
# name = "pi"
# kind = "pi"     # herdr 支持的类型：pi/claude/codex/gemini/opencode/kimi/grok/qwen…
# args = []       # 传给 agent CLI 的额外参数，如 ["--model", "xxx"]
# env = {}        # 启动前注入 pane shell 的环境变量（agy 需要代理才能连 Google）：
#
# [[agent]]
# name = "agy"
# kind = "agy"
# args = ["--dangerously-skip-permissions"]   # 全自动放行（yolo）。注意 --mode auto
#                                             # 交互模式要求 plan model，未配置会报
#                                             # "plan model not specified"
# [agent.env]
# HTTP_PROXY = "http://127.0.0.1:17890"
# HTTPS_PROXY = "http://127.0.0.1:17890"


# 目标会话：留空时，第一条发给机器人的消息会自动绑定（auto_bind = true），
# 绑定结果存在插件 state 目录 bound_target.json。也可显式填写 openid。
# openid 不是 QQ 号，是平台分配的逐 bot 唯一串，绑定后可从日志/state 里复制。
# c2c_openid = ""
# group_openid = ""
auto_bind = true

# 额外允许驱动机器人的 openid 白名单（空 = 只允许绑定的会话/自动绑定第一个人）
# allow_users = []

# --- 推送 ---------------------------------------------------------------------

# 触发推送的 agent 状态: done, blocked, idle, working, unknown
statuses = ["done", "blocked"]

# 只推送这些 agent（herdr agent id，如 "claude"）。空/省略 = 全部。
# agents = ["claude"]

# herdr 靠读终端推断状态，个别 CLI 会闪烁中间态（grok 启动时会闪 1 秒 blocked）。
# 推送前先等这么久再复查一次面板，状态已变就丢弃。0 关闭。
settle_ms = 4000

# 同一 pane+status 在这么多秒内不重复推送。
quiet_seconds = 5

# agent 最终回复最多收录多少字符。0 = 全文，自动分片。
snippet_chars = 0

# 用 msg_type=2 Markdown 发送。QQ 的 Markdown 可能为部分 bot 需要申请权限，
# 被拒绝时自动降级为纯文本重发，不会丢消息。false 直接发纯文本。
markdown = true

# 单条消息分片字符数。QQ 未公布文本长度上限（超限报 40054007/40054018），
# 实践 ~2000 以内安全；这里默认更保守。Telegram 版是 3600，QQ 版收紧了。
chunk_chars = 1000

# 单条通知最多拆成几条消息。注意：被动回复（引用你消息后的回复）单聊最多 4 条、
# 群聊最多 5 条，超过会自动转主动消息。主动推送不受此限制。
max_messages = 6

# 标题行里 pane 标题保留的字符数。
title_chars = 48

# 群聊场景把 URL 替换为域名 —— 群消息带 URL 会被直接拒绝（40054010）。单聊不受限。
strip_group_urls = true

# 发送间隔（秒）：同一会话 QQ 限频 20 条/分钟，这里串行化排队。
send_gap_seconds = 3.0

# --- 回复 ---------------------------------------------------------------------

# 接收 QQ 回复并喂给对应 agent。false = 单向推送（守护进程仍会启动以完成绑定，
# 但不会把消息注入 agent）。
replies = true

# 不引用任何通知直接发消息时投给谁：true = 最近活跃的 agent，false = 提示先 /agents。
reply_to_latest = true

# /read 默认返回的终端行数。
read_lines = 40

# `herdr agent prompt` 一次性写入文本和回车。空闲的 Claude Code 可能把回车折叠进
# 粘贴检测，文本停在输入框。若 submit_wait_ms 后 agent 没开工，补一次回车。
# 如果你的 agent 会出现重复提交，关掉它。
submit_fallback = true
submit_wait_ms = 2500

# 网关断线重连后 RESUME 重放的历史消息，超过这个分钟数的直接丢弃（防止旧消息
# 灌进 agent 当 prompt）。
stale_drop_minutes = 15

# --- 流式进度（仅单聊） -------------------------------------------------------

# agent 干活时，把终端新输出实时流进一条 QQ 流式消息（replace 模式，仅追加保证
# 前缀稳定）。完成推送仍会照发。false 关闭。
stream_progress = true

# 进度流轮询间隔（秒）。QQ 流式接口限频，别低于 3。
stream_interval_seconds = 4

# 步骤行折叠显示：💭 思维链截 60 字、🔧 工具调用只留名字+参数前 50 字、
# 中间文本不显示（完整回复在收尾片/完成推送里）。false = 完整步骤。
stream_compact = true

# 单条进度流最长持续时间（秒），超时自动收尾。
stream_max_seconds = 600

# 进度流消息的总字符预算（步骤 + 收尾回复）。回复超出预算的部分自动切成
# 后续普通消息补发，保证长回复不截断。
stream_total_chars = 3000

# --- 本机命令执行（#sh） ------------------------------------------------------

# #sh 在本机执行任意 shell 命令 —— 危险功能，默认关闭；开启前确认只有你能驱动
# 这个 bot（绑定 + allow_users 已生效）。
allow_shell = false

# #sh 超时（秒），超时进程被终止。
shell_timeout = 30

# #sh 的工作目录；留空 = 跟随当前 agent 的 cwd，再退回用户主目录。
# shell_cwd = ""

# --- 附件 ---------------------------------------------------------------------

# 接收发来的文件：保存到 <state dir>/inbox/ 并把绝对路径交给 agent（可带说明文字）。
accept_files = true

# 自动清理多少天前的 inbox 文件（守护进程每 6 小时巡检）。0 永久保留。
inbox_days = 7

# 拒绝超过这个大小的文件。QQ 入站限制：图片 8MB、语音/视频/文件 20MB、
# 单消息最多 5 个附件，这里只会更严不会更松。
max_file_mb = 20

# --- 网络/平台 ----------------------------------------------------------------

# 可选：访问 QQ API 用的代理。国内机器一般不需要（这也是换掉 Telegram 版的理由之一）。
# proxy = ""

# 可选：API 网关地址（默认 https://api.sgroup.qq.com）
# api_base = "https://api.sgroup.qq.com"

# 可选：WebSocket intents 位掩码，默认 1<<25 | 1<<26（单聊+群@消息、按钮回调）。
# intents = 100663296
